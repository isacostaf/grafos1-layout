<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Grafo da Cidade</title>
<style>
  body { font-family: sans-serif; background: #f4f4f4; }
  circle { fill: lightblue; stroke: black; }
  line { stroke: black; stroke-width: 2; }
  text { font-size: 12px; text-anchor: middle; }
</style>
</head>
<body>
  <h1>Grafo da cidade</h1>
  <svg width="500" height="350">
    <!-- ruas horizontais (lado com lado) -->
    <line x1="100" y1="100" x2="250" y2="100" />
    <line x1="250" y1="100" x2="400" y2="100" />
    <line x1="100" y1="250" x2="250" y2="250" />
    <line x1="250" y1="250" x2="400" y2="250" />

    <!-- ruas verticais (frente com frente) -->
    <line x1="100" y1="100" x2="100" y2="250" />
    <line x1="250" y1="100" x2="250" y2="250" />
    <line x1="400" y1="100" x2="400" y2="250" />

    <!-- nos linha 0 -->
    <circle cx="100" cy="100" r="18" />
    <text x="100" y="104">1</text>
    <circle cx="250" cy="100" r="18" />
    <text x="250" y="104">2</text>
    <circle cx="400" cy="100" r="18" />
    <text x="400" y="104">3</text>

    <!-- nos linha 1 -->
    <circle cx="100" cy="250" r="18" />
    <text x="100" y="254">4</text>
    <circle cx="250" cy="250" r="18" />
    <text x="250" y="254">5</text>
    <circle cx="400" cy="250" r="18" />
    <text x="400" y="254">6</text>
  </svg>
</body>
</html>
